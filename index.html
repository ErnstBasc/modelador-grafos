<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Modelador de Grafos</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >

</head>

<body>

    <!-- ==========================================
         CONTENEDOR PRINCIPAL
         ========================================== -->

    <div
        id="contenedor-grafo"
        class="contenedor-grafo"
    >

        <!-- ======================================
             TÍTULO
             ====================================== -->

        <header class="header-titulo">

            <h1>
                Modelador de Grafos
            </h1>

        </header>


        <!-- ======================================
             LIENZO SVG
             ====================================== -->

        <svg id="lienzo">

            <defs>

                <!-- ==============================
                     FLECHA NORMAL
                     ============================== -->

                <marker
                    id="flecha"
                    markerWidth="8"
                    markerHeight="8"
                    refX="7"
                    refY="3"
                    orient="auto"
                    markerUnits="strokeWidth"
                >

                    <path
                        d="M0,0 L0,6 L8,3 z"
                        fill="#333333"
                    ></path>

                </marker>


                <!-- ==============================
                     FLECHA AL INICIO
                     ============================== -->

                <marker
                    id="flecha-inicio"
                    markerWidth="8"
                    markerHeight="8"
                    refX="1"
                    refY="3"
                    orient="auto"
                    markerUnits="strokeWidth"
                >

                    <path
                        d="M8,0 L8,6 L0,3 z"
                        fill="#333333"
                    ></path>

                </marker>

            </defs>


            <!-- ==================================
                 CAPA DE ARISTAS
                 ================================== -->

            <g id="capa-aristas"></g>


            <!-- ==================================
                 CAPA DE NODOS
                 ================================== -->

            <g id="capa-nodos"></g>

        </svg>


        <!-- ======================================
             BARRA INFERIOR
             ====================================== -->

        <div class="barra-inferior">

            <button
                id="btn-matriz"
                class="btn-accion"
            >
                Matriz
            </button>

        </div>

    </div>


    <!-- ==========================================
         MENÚ CONTEXTUAL
         ========================================== -->

    <div
        id="menu-contextual"
        class="menu-contextual oculto"
    >

        <button
            id="btn-eliminar-elemento"
            class="btn-contextual peligro"
        >
            Eliminar
        </button>

    </div>


    <!-- ==========================================
         MODAL DE NODO
         ========================================== -->

    <div
        id="menu-nodo"
        class="modal oculto"
    >

        <div class="contenido-modal">

            <h3>
                Editar Nodo
            </h3>


            <!-- ==================================
                 ETIQUETA
                 ================================== -->

            <div class="campo-form">

                <label for="nodo-etiqueta">
                    Etiqueta:
                </label>

                <input
                    type="text"
                    id="nodo-etiqueta"
                    maxlength="15"
                >

            </div>


            <!-- ==================================
                 COLOR
                 ================================== -->

            <div class="campo-form">

                <label>
                    Color del nodo:
                </label>

                <div
                    id="paleta-colores"
                    class="paleta-colores"
                >

                    <button
                        type="button"
                        class="opcion-color"
                        data-color="#4CAF50"
                        style="background-color: #4CAF50;"
                    ></button>

                    <button
                        type="button"
                        class="opcion-color"
                        data-color="#2196F3"
                        style="background-color: #2196F3;"
                    ></button>

                    <button
                        type="button"
                        class="opcion-color"
                        data-color="#FF9800"
                        style="background-color: #FF9800;"
                    ></button>

                    <button
                        type="button"
                        class="opcion-color"
                        data-color="#E91E63"
                        style="background-color: #E91E63;"
                    ></button>

                    <button
                        type="button"
                        class="opcion-color"
                        data-color="#9C27B0"
                        style="background-color: #9C27B0;"
                    ></button>

                </div>

            </div>


            <!-- ==================================
                 RADIO
                 ================================== -->

            <div class="campo-form">

                <label for="nodo-radio">
                    Radio (px):
                </label>

                <input
                    type="number"
                    id="nodo-radio"
                    min="15"
                    max="50"
                >

            </div>


            <!-- ==================================
                 BOTONES
                 ================================== -->

            <div class="acciones-modal">

                <button
                    id="btn-guardar-nodo"
                    class="btn-primario"
                >
                    Guardar
                </button>

                <button
                    id="btn-cancelar-nodo"
                    class="btn-secundario"
                >
                    Cancelar
                </button>

            </div>

        </div>

    </div>


    <!-- ==========================================
         MODAL DE ARISTA
         ========================================== -->

    <div
        id="menu-arista"
        class="modal oculto"
    >

        <div class="contenido-modal">

            <h3>
                Editar Arista
            </h3>


            <!-- ==================================
                 TIPO DE ARISTA
                 ================================== -->

            <div class="campo-form">

                <label>
                    Tipo de Arista:
                </label>

                <div class="grupo-radio">

                    <label>

                        <input
                            type="radio"
                            name="tipo-arista"
                            value="no_dirigida"
                        >

                        No Dirigida

                    </label>


                    <label>

                        <input
                            type="radio"
                            name="tipo-arista"
                            value="dirigida"
                        >

                        Dirigida

                    </label>

                </div>

            </div>


            <!-- ==================================
                 PESO
                 ================================== -->

            <div
                id="campo-peso-simple"
                class="campo-form"
            >

                <label for="arista-peso">
                    Peso:
                </label>

                <input
                    type="number"
                    id="arista-peso"
                    step="any"
                    placeholder="Ej: 5"
                >

            </div>


            <!-- ==================================
                 BOTONES
                 ================================== -->

            <div class="acciones-modal">

                <button
                    id="btn-guardar-arista"
                    class="btn-primario"
                >
                    Guardar
                </button>

                <button
                    id="btn-cancelar-arista"
                    class="btn-secundario"
                >
                    Cancelar
                </button>

            </div>

        </div>

    </div>


    <!-- ==========================================
         SCRIPTS
         ========================================== -->

    <script src="js/Nodo.js"></script>

    <script src="js/Arista.js"></script>

    <script src="js/Grafo.js"></script>

    <script src="js/Renderizador.js"></script>

    <script src="js/Matriz.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
